<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация · ORBITA</title>
<meta name="description" content="Создание профиля космического путешественника в сервисе ORBITA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05070f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<canvas id="stars"></canvas>
<div id="site-header"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">Профиль путешественника</span>
    <h1>Регистрация</h1>
    <p class="auth-sub">Создайте аккаунт — он станет единым хранилищем допусков, показателей и плана подготовки.
    Уже есть профиль? <a href="login.html">Войти</a></p>

    <div class="alert" id="alert"></div>

    <form id="regForm" novalidate>
      <div class="field">
        <label for="name">ФИО</label>
        <input id="name" type="text" placeholder="Иванов Иван Иванович" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="login">Логин</label>
        <input id="login" type="text" placeholder="ivanov - латиница, 3-20 символов" autocomplete="username" required>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="birth">Дата рождения</label>
          <input id="birth" type="date" autocomplete="bday">
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" type="password" placeholder="Минимум 6 символов" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="confirm">Повторите пароль</label>
          <input id="confirm" type="password" placeholder="Ещё раз" autocomplete="new-password" required>
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="city">Город</label>
          <input id="city" type="text" placeholder="Москва" autocomplete="address-level2">
        </div>
        <div class="field">
          <label for="program">Программа полёта</label>
          <select id="program">
            <option>Суборбитальный полёт · 15 минут</option>
            <option>Орбитальный полёт · 1–3 дня</option>
            <option>Полёт к станции · 7 дней</option>
            <option>Лунная программа</option>
          </select>
        </div>
      </div>

      <label class="check">
        <input id="terms" type="checkbox" required>
        <span>Согласен на обработку данных для участия в исследовании и получение рекомендаций по подготовке.</span>
      </label>

      <button class="btn" type="submit">Создать профиль</button>
    </form>

    <p class="hint">Демо-версия проекта: аккаунты хранятся только в вашем браузере (localStorage) и не передаются на сервер.</p>
  </div>
</div>

<div id="site-footer"></div>
<script src="auth.js"></script>
<script src="layout.js"></script>
<script src="script.js"></script>
<script>
const form = document.getElementById('regForm');
const alertBox = document.getElementById('alert');

const showAlert = (type, html) => {
  alertBox.className = 'alert ' + type;
  alertBox.innerHTML = html;
};

// Если уже вошли — сразу в профиль
OrbAuth.onReady(() => { if (OrbAuth.current()) location.href = 'profile.html'; });

form.addEventListener('submit', async e => {
  e.preventDefault();

  const data = {
    name: document.getElementById('name').value,
    login: document.getElementById('login').value.trim().toLowerCase(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
    confirm: document.getElementById('confirm').value,
    birth: document.getElementById('birth').value,
    city: document.getElementById('city').value.trim(),
    program: document.getElementById('program').value
  };

  if (!document.getElementById('terms').checked) {
    showAlert('err', 'Необходимо согласие на обработку данных.');
    return;
  }

  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true;
  const res = await OrbAuth.register(data);
  btn.disabled = false;

  if (!res.ok) {
    showAlert('err', '<ul>' + (res.errors || ['Ошибка регистрации.']).map(x => '<li>' + x + '</li>').join('') + '</ul>');
    return;
  }

  showAlert('ok', 'Профиль создан! Баланс пополнен на 500 000 ₽ (демо-бонус). Перенаправляем…');
  setTimeout(() => location.href = 'profile.html', 800);
});
</script>
</body>
</html>
